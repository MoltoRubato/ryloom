<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:"
    />
    <title>Ryloom region selector</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        background: transparent;
        overflow: hidden;
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI",
          Helvetica, Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
        user-select: none;
        cursor: crosshair;
      }

      /* Pre-drag dim across the whole display; the selection punches through. */
      .scrim {
        position: absolute;
        inset: 0;
        background: rgba(10, 9, 16, 0.32);
      }

      .instructions {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        background: rgba(18, 16, 26, 0.92);
        border: 1px solid rgba(255, 255, 255, 0.16);
        border-radius: 14px;
        padding: 16px 26px;
        text-align: center;
        color: rgba(255, 255, 255, 0.95);
        box-shadow: 0 18px 60px rgba(0, 0, 0, 0.5);
        pointer-events: none;
        animation: fade-in 0.16s ease-out;
      }

      .instructions .title {
        font-size: 16px;
        font-weight: 700;
      }

      .instructions .sub {
        margin-top: 5px;
        font-size: 13px;
        color: rgba(255, 255, 255, 0.65);
      }

      .instructions kbd {
        font-family: inherit;
        font-size: 12px;
        background: rgba(255, 255, 255, 0.12);
        border-radius: 5px;
        padding: 1px 6px;
      }

      @keyframes fade-in {
        from { opacity: 0; }
        to { opacity: 1; }
      }

      /* The drag rectangle — a clear cutout, dimming everything around it. */
      .selection {
        position: absolute;
        display: none;
        border: 1.5px solid #625df5;
        box-shadow:
          0 0 0 1px rgba(255, 255, 255, 0.35) inset,
          0 0 0 100000px rgba(10, 9, 16, 0.45);
      }

      .size-badge {
        position: absolute;
        display: none;
        background: rgba(18, 16, 26, 0.92);
        border: 1px solid rgba(255, 255, 255, 0.16);
        color: rgba(255, 255, 255, 0.95);
        font-size: 12px;
        font-weight: 600;
        font-variant-numeric: tabular-nums;
        border-radius: 7px;
        padding: 3px 9px;
        pointer-events: none;
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <div class="scrim" id="scrim"></div>
    <div class="instructions" id="instructions">
      <div class="title">Drag to choose the area to record</div>
      <div class="sub">Release to confirm · <kbd>Esc</kbd> to cancel</div>
    </div>
    <div class="selection" id="selection"></div>
    <div class="size-badge" id="size-badge"></div>

    <script>
      const { ipcRenderer } = require("electron");

      const displayId =
        new URLSearchParams(window.location.search).get("displayId") || "";
      const MIN_SIZE = 50; // smaller drags are treated as accidental clicks

      const scrim = document.getElementById("scrim");
      const instructions = document.getElementById("instructions");
      const selection = document.getElementById("selection");
      const sizeBadge = document.getElementById("size-badge");

      let startX = 0;
      let startY = 0;
      let dragging = false;
      let done = false;

      const finish = (rect) => {
        if (done) return;
        done = true;
        // Coordinates are CSS px relative to this display (== DIPs); the main
        // process translates them to global coords and closes every overlay.
        ipcRenderer.send("region-done", rect ? { displayId, rect } : null);
      };

      const currentRect = (event) => {
        const x = Math.min(startX, event.clientX);
        const y = Math.min(startY, event.clientY);
        return {
          x,
          y,
          width: Math.abs(event.clientX - startX),
          height: Math.abs(event.clientY - startY),
        };
      };

      const paint = (rect) => {
        selection.style.display = "block";
        selection.style.left = `${rect.x}px`;
        selection.style.top = `${rect.y}px`;
        selection.style.width = `${rect.width}px`;
        selection.style.height = `${rect.height}px`;

        sizeBadge.style.display = "block";
        sizeBadge.textContent = `${rect.width} × ${rect.height}`;
        // Below the rect when there's room, inside its top edge otherwise.
        const below = rect.y + rect.height + 30 < window.innerHeight;
        sizeBadge.style.left = `${Math.min(rect.x, window.innerWidth - 110)}px`;
        sizeBadge.style.top = below
          ? `${rect.y + rect.height + 8}px`
          : `${Math.max(4, rect.y + 8)}px`;
      };

      window.addEventListener("mousedown", (event) => {
        if (event.button !== 0 || done) return;
        dragging = true;
        startX = event.clientX;
        startY = event.clientY;
        instructions.style.display = "none";
        scrim.style.display = "none"; // the selection's shadow dims instead
        paint(currentRect(event));
      });

      window.addEventListener("mousemove", (event) => {
        if (!dragging || done) return;
        paint(currentRect(event));
      });

      window.addEventListener("mouseup", (event) => {
        if (!dragging || done) return;
        dragging = false;
        const rect = currentRect(event);
        if (rect.width >= MIN_SIZE && rect.height >= MIN_SIZE) {
          finish(rect);
          return;
        }
        // Too small — reset and let the user try again.
        selection.style.display = "none";
        sizeBadge.style.display = "none";
        scrim.style.display = "block";
        instructions.style.display = "block";
      });

      window.addEventListener("keydown", (event) => {
        if (event.key === "Escape") finish(null);
      });
    </script>
  </body>
</html>
