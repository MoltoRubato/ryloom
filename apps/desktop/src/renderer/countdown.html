<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:"
    />
    <title>Ryloom countdown</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        background: transparent;
        overflow: hidden;
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI",
          Helvetica, Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
        user-select: none;
        cursor: pointer;
      }

      /* Full-display dim — the whole screen visibly "gets ready". This window
         is content-protected so none of it appears in the recording. */
      .scrim {
        position: absolute;
        inset: 0;
        background: radial-gradient(
          ellipse at center,
          rgba(10, 9, 16, 0.42) 0%,
          rgba(10, 9, 16, 0.62) 100%
        );
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 28px;
        animation: fade-in 0.18s ease-out;
      }

      @keyframes fade-in {
        from { opacity: 0; }
        to { opacity: 1; }
      }

      .ring {
        width: 220px;
        height: 220px;
        border-radius: 50%;
        background: rgba(18, 16, 26, 0.85);
        border: 4px solid rgba(98, 93, 245, 0.9);
        box-shadow: 0 0 0 14px rgba(98, 93, 245, 0.18), 0 24px 80px rgba(0, 0, 0, 0.55);
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .number {
        font-size: 120px;
        font-weight: 800;
        color: #fff;
        line-height: 1;
        animation: pulse 1s ease-out;
      }

      @keyframes pulse {
        0% { transform: scale(1.35); opacity: 0.2; }
        30% { transform: scale(1); opacity: 1; }
        100% { transform: scale(1); opacity: 1; }
      }

      .hint {
        font-size: 15px;
        font-weight: 500;
        color: rgba(255, 255, 255, 0.85);
        text-shadow: 0 1px 8px rgba(0, 0, 0, 0.6);
      }

      .cancel {
        appearance: none;
        border: 1px solid rgba(255, 255, 255, 0.28);
        background: rgba(18, 16, 26, 0.75);
        color: rgba(255, 255, 255, 0.92);
        font-family: inherit;
        font-size: 14px;
        font-weight: 600;
        padding: 9px 22px;
        border-radius: 999px;
        cursor: pointer;
        transition: background 0.12s ease;
      }

      .cancel:hover {
        background: rgba(242, 92, 92, 0.85);
        border-color: transparent;
      }
    </style>
  </head>
  <body>
    <div class="scrim" id="scrim">
      <div class="ring">
        <div class="number" id="number">3</div>
      </div>
      <div class="hint">Click anywhere to start now · Esc to cancel</div>
      <button class="cancel" id="cancel">Cancel</button>
    </div>

    <script>
      const { ipcRenderer } = require("electron");

      const numberEl = document.getElementById("number");
      let n = 3;
      let done = false;

      const finish = (completed) => {
        if (done) return;
        done = true;
        clearInterval(timer);
        ipcRenderer.send("countdown-done", completed);
      };

      const timer = setInterval(() => {
        n -= 1;
        if (n <= 0) {
          finish(true);
          return;
        }
        numberEl.textContent = String(n);
        numberEl.style.animation = "none";
        void numberEl.offsetHeight; // retrigger the pulse
        numberEl.style.animation = "";
      }, 1000);

      // Click anywhere = skip straight to recording; the Cancel pill aborts.
      document.getElementById("scrim").addEventListener("click", () => finish(true));
      document.getElementById("cancel").addEventListener("click", (event) => {
        event.stopPropagation();
        finish(false);
      });
      window.addEventListener("keydown", (event) => {
        if (event.key === "Escape") finish(false);
        if (event.key === "Enter" || event.key === " ") finish(true);
      });
    </script>
  </body>
</html>
