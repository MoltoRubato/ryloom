<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:"
    />
    <title>Speaker notes</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        background: transparent;
        overflow: hidden;
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI",
          Helvetica, Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      /* Content-protected: the presenter sees their notes, the recording
         never does. */
      .card {
        display: flex;
        flex-direction: column;
        width: 100%;
        height: 100%;
        border-radius: 14px;
        overflow: hidden;
        background: rgba(20, 18, 28, 0.96);
        border: 1px solid rgba(255, 255, 255, 0.12);
        box-shadow: 0 14px 44px rgba(0, 0, 0, 0.55);
      }

      header {
        -webkit-app-region: drag;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 10px 12px 10px 14px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        flex-shrink: 0;
      }

      header .title {
        display: flex;
        align-items: center;
        gap: 7px;
        font-size: 12.5px;
        font-weight: 700;
        letter-spacing: 0.02em;
        color: rgba(255, 255, 255, 0.85);
      }

      header .title svg {
        color: #625df5;
      }

      .header-actions {
        -webkit-app-region: no-drag;
        display: flex;
        align-items: center;
        gap: 2px;
      }

      .header-actions button {
        appearance: none;
        border: none;
        background: transparent;
        color: rgba(255, 255, 255, 0.6);
        width: 26px;
        height: 26px;
        border-radius: 7px;
        cursor: pointer;
        font-size: 13px;
        font-weight: 700;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: background 0.12s ease, color 0.12s ease;
      }

      .header-actions button:hover {
        background: rgba(255, 255, 255, 0.12);
        color: #fff;
      }

      #close:hover {
        background: rgba(242, 92, 92, 0.85);
      }

      textarea {
        flex: 1;
        width: 100%;
        resize: none;
        border: none;
        outline: none;
        background: transparent;
        color: rgba(255, 255, 255, 0.92);
        padding: 14px 16px 16px;
        font-family: inherit;
        font-size: 16px;
        line-height: 1.65;
        user-select: text;
      }

      textarea::placeholder {
        color: rgba(255, 255, 255, 0.3);
      }

      footer {
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 7px 14px;
        border-top: 1px solid rgba(255, 255, 255, 0.08);
        font-size: 11px;
        color: rgba(255, 255, 255, 0.4);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <header>
        <div class="title">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15.5 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V8.5z"/><path d="M15 3v6h6"/></svg>
          SPEAKER NOTES
        </div>
        <div class="header-actions">
          <button id="font-down" title="Smaller text">A−</button>
          <button id="font-up" title="Larger text">A+</button>
          <button id="close" title="Close">✕</button>
        </div>
      </header>
      <textarea
        id="notes"
        placeholder="Jot down what you want to say… Only you can see this — it never appears in the recording."
        spellcheck="false"
      ></textarea>
      <footer>
        <span>Autosaved</span>
        <span>Not visible in recordings</span>
      </footer>
    </div>

    <script>
      const { ipcRenderer } = require("electron");

      const textarea = document.getElementById("notes");
      let saveTimer = null;
      let fontSize = 16;

      async function load() {
        const saved = await ipcRenderer.invoke("store-get", "speakerNotes");
        if (typeof saved === "string") textarea.value = saved;
        const size = await ipcRenderer.invoke("store-get", "speakerNotesFontSize");
        if (Number.isFinite(size) && size >= 12 && size <= 32) {
          fontSize = size;
          textarea.style.fontSize = `${fontSize}px`;
        }
        textarea.focus();
      }

      textarea.addEventListener("input", () => {
        clearTimeout(saveTimer);
        saveTimer = setTimeout(() => {
          ipcRenderer.invoke("store-set", "speakerNotes", textarea.value);
        }, 400);
      });

      function bumpFont(delta) {
        fontSize = Math.max(12, Math.min(32, fontSize + delta));
        textarea.style.fontSize = `${fontSize}px`;
        ipcRenderer.invoke("store-set", "speakerNotesFontSize", fontSize);
      }

      document.getElementById("font-up").addEventListener("click", () => bumpFont(2));
      document.getElementById("font-down").addEventListener("click", () => bumpFont(-2));
      document.getElementById("close").addEventListener("click", () => {
        clearTimeout(saveTimer);
        ipcRenderer.invoke("store-set", "speakerNotes", textarea.value).then(() => {
          ipcRenderer.invoke("notes-close");
        });
      });

      window.addEventListener("beforeunload", () => {
        clearTimeout(saveTimer);
      });

      load();
    </script>
  </body>
</html>
